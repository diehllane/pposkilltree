<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeNexus Trainer Tree Planner</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1e222b; --line:#2b303b; --text:#e6e8ee; --muted:#8b92a3;
    --accent:#e5484d; --accent2:#ff6b6f; --ok:#3fb950; --warn:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{display:grid;grid-template-columns:1fr 360px;height:100vh}
  header{position:absolute;left:0;top:0;right:360px;padding:12px 16px;display:flex;gap:12px;align-items:center;pointer-events:none;z-index:2}
  header h1{font-size:16px;margin:0;letter-spacing:.3px;pointer-events:auto}
  header .sub{color:var(--muted);font-size:12px}
  .stage{position:relative;overflow:hidden;cursor:grab;background:radial-gradient(ellipse at center,#161a22 0%,#0f1116 70%)}
  .stage.dragging{cursor:grabbing}
  svg{width:100%;height:100%;display:block;user-select:none}
  .edge{stroke:#3a404d;stroke-width:1.4}
  .edge.on{stroke:var(--accent);stroke-width:2.4}
  .edge.preview{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}
  .node circle.body{fill:#555c6b;stroke:#0f1116;stroke-width:1.5;transition:fill .12s}
  .node.keystone circle.body,.node.skill circle.body{fill:#1b1f27;stroke:#8b92a3;stroke-width:2}
  .node.keystone circle.ring{fill:none;stroke:#8b92a3;stroke-width:1.2;opacity:.6}
  .node.skill circle.body{stroke:#c9a64a}
  .node:hover circle.body{fill:#8b92a3}
  .node.on circle.body{fill:var(--accent);stroke:#ffd0d1}
  .node.preview circle.body{fill:var(--warn)}
  .node.locked{opacity:.45}
  .node.match circle.body{stroke:#58a6ff;stroke-width:3}
  .node.dim{opacity:.18}
  .root circle{fill:#fff;stroke:var(--accent);stroke-width:3}
  .blabel{fill:#5d6474;font-size:20px;font-weight:700;letter-spacing:2px;text-anchor:middle;pointer-events:none}
  aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
  .row{display:flex;gap:10px;align-items:center;margin:6px 0}
  .row label{flex:1;color:var(--muted)}
  input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;width:96px}
  input[type=text]{width:100%}
  .pts{font-size:26px;font-weight:700}
  .pts small{font-size:13px;color:var(--muted);font-weight:400}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
  .bar>div{height:100%;background:var(--accent);width:0}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{border-color:#4a5162}
  button.primary{background:var(--accent);border-color:var(--accent)}
  .totals{overflow:auto;flex:1;padding:12px 16px}
  .tgroup{margin-bottom:12px}
  .tgroup h3{font-size:13px;margin:0 0 4px;display:flex;justify-content:space-between}
  .tgroup h3 span{color:var(--muted);font-weight:400}
  .tline{font-size:13px;color:#c9cdd6;padding:2px 0 2px 10px;border-left:2px solid var(--line)}
  .tline b{color:#fff}
  .empty{color:var(--muted);font-size:13px}
  .tip{position:absolute;pointer-events:none;background:#11141a;border:1px solid #333a47;border-radius:8px;padding:10px 12px;max-width:300px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;z-index:5}
  .tip .n{font-weight:700;font-size:14px}
  .tip .m{color:var(--muted);font-size:12px;margin-bottom:6px}
  .tip .c{color:var(--accent2);font-size:12px;margin-top:6px}
  .tip .w{color:var(--warn);font-size:12px;margin-top:6px}
  .hint{position:absolute;left:16px;bottom:12px;color:var(--muted);font-size:12px;z-index:2}
  .zoom{position:absolute;right:16px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
  .zoom button{width:32px;height:32px;padding:0;font-size:16px}
  .toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#2a1214;border:1px solid var(--accent);color:#ffd0d1;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:6}
  @media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:60vh 1fr}header{right:0}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <header><div><h1>PokeNexus Trainer Tree Planner</h1><div class="sub" id="meta"></div></div></header>
    <svg id="svg"><g id="vp"><g id="edges"></g><g id="labels"></g><g id="nodes"></g></g></svg>
    <div class="tip" id="tip"></div>
    <div class="toast" id="toast"></div>
    <div class="hint">Click a node to take it and the cheapest path to it · Right-click a taken node to refund it · Drag to pan · Scroll to zoom</div>
    <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit">⤢</button></div>
  </div>
  <aside>
    <div class="sec">
      <h2>Trainer</h2>
      <div class="row"><label for="lvl">Trainer level</label><input type="number" id="lvl" min="1" max="200" value="80"></div>
      <div class="row"><label for="budget">Skill points</label><input type="number" id="budget" min="0" max="999" value="80"></div>
      <div class="row"><label><input type="checkbox" id="link" checked> Points = level</label></div>
    </div>
    <div class="sec">
      <div class="pts"><span id="spent">0</span> <small>/ <span id="cap">80</span> points spent</small></div>
      <div class="bar"><div id="barfill"></div></div>
      <div class="row" style="margin-top:10px"><input type="text" id="search" placeholder="Search nodes (e.g. shiny, drop, Sweet Scent)"></div>
      <div class="btns">
        <button id="share" class="primary">Copy share link</button>
        <button id="exportb">Copy build text</button>
        <button id="reset">Reset</button>
      </div>
      <div class="btns" style="margin-top:6px">
        <button data-slot="1">Save 1</button><button data-slot="2">Save 2</button><button data-slot="3">Save 3</button>
        <button data-load="1">Load 1</button><button data-load="2">Load 2</button><button data-load="3">Load 3</button>
      </div>
    </div>
    <div class="totals" id="totals"></div>
  </aside>
</div>

<script>
(async function(){
  let DATA;
  try{ if(location.protocol==='file:') throw 0; const r=await fetch('skilltree.json',{cache:'no-store'}); if(!r.ok) throw 0; DATA=await r.json(); }
  catch(e){ DATA=JSON.parse(document.getElementById('treedata').textContent); }

  const S=4; // layout scale
  const COLORS={Seeker:'#58a6ff',Hunter:'#f0883e',Collector:'#a371f7',Battler:'#f85149',Trainer:'#3fb950',Angler:'#39c5cf',Prospector:'#d29922',Fortune:'#e3b341',Explorer:'#7ee787',Breeder:'#ff7b72'};
  const nodes=DATA.nodes, byId={root:{...DATA.root,cost:0,branch:'',type:'root'}};
  nodes.forEach(n=>byId[n.id]=n);
  const adj={}; Object.keys(byId).forEach(k=>adj[k]=[]);
  DATA.edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});
  document.getElementById('meta').textContent=`${nodes.length} nodes · ${DATA.meta.game} · captured ${DATA.meta.captured}`;

  const owned=new Set();
  const $=id=>document.getElementById(id);
  const svg=$('svg'), vp=$('vp');
  const NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

  // edges
  const edgeEls=DATA.edges.map(([a,b])=>{const A=byId[a],B=byId[b];const l=el('line',{x1:A.x*S,y1:A.y*S,x2:B.x*S,y2:B.y*S,class:'edge'});$('edges').appendChild(l);return {a,b,l};});
  // branch labels at centroid pushed outward
  const groups={};nodes.forEach(n=>{(groups[n.branch]=groups[n.branch]||[]).push(n)});
  for(const [b,arr] of Object.entries(groups)){
    let x=0,y=0;arr.forEach(n=>{x+=n.x;y+=n.y});x/=arr.length;y/=arr.length;const d=Math.hypot(x,y)||1;
    const t=el('text',{x:x/d*(d+40)*S,y:y/d*(d+40)*S,class:'blabel',fill:COLORS[b]||'#5d6474'});t.style.fill=COLORS[b];t.style.opacity=.8;t.textContent=b.toUpperCase();$('labels').appendChild(t);
  }
  // nodes
  const nodeEls={};
  const rg=el('g',{class:'root'});rg.appendChild(el('circle',{cx:0,cy:0,r:9}));$('nodes').appendChild(rg);
  nodes.forEach(n=>{
    const g=el('g',{class:'node '+n.type,'data-id':n.id});
    const r=n.type==='node'?(n.cost>1?6.5:5.2):9;
    if(n.type==='keystone') g.appendChild(el('circle',{class:'ring',cx:n.x*S,cy:n.y*S,r:r+4}));
    const c=el('circle',{class:'body',cx:n.x*S,cy:n.y*S,r});
    g.appendChild(c);
    g.appendChild(el('circle',{cx:n.x*S,cy:n.y*S,r:r+5,fill:'transparent'}));
    if(n.type!=='node'){c.style.stroke=COLORS[n.branch];}
    $('nodes').appendChild(g);nodeEls[n.id]=g;
    g.addEventListener('mouseenter',e=>showTip(n,e));
    g.addEventListener('mousemove',e=>{if(hov)hov.e=e;moveTip(e);});
    g.addEventListener('mouseleave',()=>{hideTip();clearPreview();});
    g.addEventListener('click',e=>{e.stopPropagation();take(n.id);});
    g.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();refund(n.id);});
  });

  // ---- rules ----
  const level=()=>+$('lvl').value||1;
  const budget=()=>+$('budget').value||0;
  const spent=()=>[...owned].reduce((s,id)=>s+byId[id].cost,0);
  const allowed=id=>{const n=byId[id];return !n.levelReq||level()>=n.levelReq;};
  function cheapestPath(target){
    // Dijkstra from root+owned over allowed nodes; returns list of new node ids
    const dist={},prev={},pq=[];const push=(d,id)=>{pq.push([d,id]);pq.sort((a,b)=>a[0]-b[0]);};
    ['root',...owned].forEach(id=>{dist[id]=0;push(0,id);});
    while(pq.length){const [d,u]=pq.shift();if(d>dist[u])continue;if(u===target)break;
      for(const v of adj[u]){ if(!allowed(v)) continue; const nd=d+(owned.has(v)?0:byId[v].cost);
        if(nd<(dist[v]??1e9)){dist[v]=nd;prev[v]=u;push(nd,v);} } }
    if(dist[target]===undefined) return null;
    const path=[];let c=target;while(c&&!owned.has(c)&&c!=='root'){path.push(c);c=prev[c];}
    return {cost:dist[target],path};
  }
  function baseCost(id){ // cost from empty tree
    const saved=[...owned];owned.clear();const r=cheapestPath(id);saved.forEach(x=>owned.add(x));return r?r.cost:null;}
  function take(id){
    if(owned.has(id)) return;
    if(!allowed(id)){toast(`${byId[id].name} needs trainer level ${byId[id].levelReq}`);return;}
    const r=cheapestPath(id); if(!r){toast('No reachable path (a node on the way needs a higher trainer level)');return;}
    if(spent()+r.cost>budget()){toast(`Needs ${r.cost} points, you have ${budget()-spent()} left`);return;}
    r.path.forEach(x=>owned.add(x)); render(); clearPreview();
  }
  function refund(id){
    if(!owned.has(id)) return;
    owned.delete(id);
    // drop anything no longer connected to root
    const seen=new Set(['root']),st=['root'];
    while(st.length){const u=st.pop();for(const v of adj[u]) if(owned.has(v)&&!seen.has(v)){seen.add(v);st.push(v);}}
    [...owned].forEach(x=>{if(!seen.has(x)) owned.delete(x);});
    render();
  }
  // level change may invalidate gated nodes
  function enforceLevel(){[...owned].forEach(id=>{if(!allowed(id)) refund(id);});}

  // ---- preview on hover ----
  let previewSet=new Set();
  function preview(id){
    clearPreview(); if(owned.has(id)||!allowed(id)) return null;
    const r=cheapestPath(id); if(!r) return null;
    previewSet=new Set(r.path); previewSet.forEach(x=>nodeEls[x].classList.add('preview'));
    edgeEls.forEach(e=>{const inA=previewSet.has(e.a)||owned.has(e.a)||e.a==='root',inB=previewSet.has(e.b)||owned.has(e.b)||e.b==='root';
      if(inA&&inB&&(previewSet.has(e.a)||previewSet.has(e.b))) e.l.classList.add('preview');});
    return r;
  }
  function clearPreview(){previewSet.forEach(x=>nodeEls[x].classList.remove('preview'));previewSet=new Set();edgeEls.forEach(e=>e.l.classList.remove('preview'));}

  // ---- tooltip ----
  const tip=$('tip');
  let hov=null;
  function showTip(n,e){
    hov={n,e};
    const r=preview(n.id);
    const typ=n.type==='keystone'?' keystone':n.type==='skill'?' trainer skill':'';
    let h=`<div class="n">${n.name}</div><div class="m">${n.branch}${typ} · ${n.cost} point${n.cost>1?'s':''}</div><div>${n.effect.replace(/; /g,'<br>')}</div>`;
    if(owned.has(n.id)) h+=`<div class="c">Taken · right-click to refund</div>`;
    else if(!allowed(n.id)) h+=`<div class="w">Needs trainer level ${n.levelReq}</div>`;
    else if(r) h+=`<div class="c">Path: ${r.cost} point${r.cost>1?'s':''}${n.levelReq?` · needs trainer level ${n.levelReq}`:''}</div>`;
    tip.innerHTML=h;tip.style.display='block';moveTip(e);
  }
  function moveTip(e){const b=$('stage').getBoundingClientRect();let x=e.clientX-b.left+16,y=e.clientY-b.top+12;
    if(x+310>b.width)x-=330;if(y+160>b.height)y-=170;tip.style.left=x+'px';tip.style.top=y+'px';}
  function hideTip(){tip.style.display='none';hov=null;}
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600);}

  // ---- totals ----
  function totals(){
    const by={};
    [...owned].forEach(id=>{const n=byId[id];(by[n.branch]=by[n.branch]||[]).push(n);});
    const box=$('totals');box.innerHTML='';
    if(!owned.size){box.innerHTML='<div class="empty">Take nodes in the tree to see this build\'s bonuses.</div>';return;}
    Object.keys(by).sort().forEach(b=>{
      const arr=by[b];const sums={},order=[],flat=[];
      arr.forEach(n=>n.effect.split('; ').forEach(part=>{
        const m=part.match(/^([+-]?)(\d+(?:\.\d+)?)%\s+(.*)$/);
        if(m&&n.type==='node'){const key=(m[1]==='-'?'-':'+')+'|'+m[3];if(!(key in sums)){sums[key]=0;order.push(key);}sums[key]+=parseFloat(m[2]);}
        else flat.push(`<b>${n.name}</b>: ${part}`);
      }));
      const g=document.createElement('div');g.className='tgroup';
      g.innerHTML=`<h3 style="color:${COLORS[b]}">${b}<span>${arr.reduce((s,n)=>s+n.cost,0)} pts</span></h3>`+
        order.map(k=>{const [sg,txt]=k.split('|');const v=Math.round(sums[k]*100)/100;return `<div class="tline"><b>${sg}${v}%</b> ${txt}</div>`;}).join('')+
        flat.map(t=>`<div class="tline">${t}</div>`).join('');
      box.appendChild(g);
    });
  }

  // ---- render ----
  function render(){
    nodes.forEach(n=>{const g=nodeEls[n.id];g.classList.toggle('on',owned.has(n.id));g.classList.toggle('locked',!allowed(n.id));});
    edgeEls.forEach(e=>e.l.classList.toggle('on',(owned.has(e.a)||e.a==='root')&&(owned.has(e.b)||e.b==='root')));
    const s=spent(),cap=budget();$('spent').textContent=s;$('cap').textContent=cap;
    $('barfill').style.width=Math.min(100,cap?s/cap*100:0)+'%';$('barfill').style.background=s>cap?'var(--warn)':'';
    totals(); writeHash();
    if(hov) showTip(hov.n,hov.e);
  }
  // ---- share / save ----
  function encode(){return 'L'+level()+(($('link').checked)?'':'.P'+budget())+'.'+[...owned].sort().join(',');}
  function decode(s){
    if(!s) return; const parts=s.split('.');
    parts.forEach(p=>{if(/^L\d+$/.test(p)){$('lvl').value=p.slice(1);}else if(/^P\d+$/.test(p)){$('link').checked=false;$('budget').value=p.slice(1);}});
    const ids=(parts[parts.length-1]||'').split(',').filter(x=>byId[x]&&x!=='root');
    if($('link').checked)$('budget').value=$('lvl').value;
    owned.clear();ids.forEach(x=>owned.add(x));
  }
  function writeHash(){try{history.replaceState(null,'','#'+encode());}catch(e){}}
  $('share').onclick=()=>{writeHash();navigator.clipboard?.writeText(location.href).then(()=>toast('Share link copied'),()=>toast(location.href));};
  $('exportb').onclick=()=>{const lines=[`PokeNexus Trainer Tree build — level ${level()}, ${spent()}/${budget()} points`];
    const by={};[...owned].forEach(id=>{const n=byId[id];(by[n.branch]=by[n.branch]||[]).push(n);});
    Object.keys(by).sort().forEach(b=>{lines.push(`\n${b}:`);by[b].sort((a,c)=>a.pathCost-c.pathCost).forEach(n=>lines.push(`  - ${n.name} (${n.cost}): ${n.effect}`));});
    navigator.clipboard?.writeText(lines.join('\n')).then(()=>toast('Build text copied'),()=>toast('Copy failed'));};
  $('reset').onclick=()=>{owned.clear();render();};
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('pnx-tree-'+b.dataset.slot,encode());toast('Saved to slot '+b.dataset.slot);}catch(e){toast('Saving is not available in this browser');}});
  document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{try{const v=localStorage.getItem('pnx-tree-'+b.dataset.load);if(!v){toast('Slot is empty');return;}decode(v);render();}catch(e){toast('Loading is not available in this browser');}});

  // ---- inputs ----
  $('lvl').oninput=()=>{if($('link').checked)$('budget').value=$('lvl').value;enforceLevel();render();};
  $('budget').oninput=()=>{$('link').checked=false;render();};
  $('link').onchange=()=>{if($('link').checked)$('budget').value=$('lvl').value;render();};
  $('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();
    nodes.forEach(n=>{const g=nodeEls[n.id];const hit=q&&(n.name+' '+n.effect+' '+n.branch).toLowerCase().includes(q);g.classList.toggle('match',!!hit);g.classList.toggle('dim',!!q&&!hit);});};

  // ---- pan/zoom ----
  let view={x:0,y:0,k:1};
  const apply=()=>vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  function fit(){const b=svg.getBoundingClientRect();const xs=nodes.map(n=>n.x*S),ys=nodes.map(n=>n.y*S);
    const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-60,y1=Math.max(...ys)+60;
    view.k=Math.min(b.width/(x1-x0),b.height/(y1-y0));view.x=b.width/2-(x0+x1)/2*view.k;view.y=b.height/2-(y0+y1)/2*view.k;apply();}
  function zoomAt(f,cx,cy){const nk=Math.max(.3,Math.min(6,view.k*f));view.x=cx-(cx-view.x)*nk/view.k;view.y=cy-(cy-view.y)*nk/view.k;view.k=nk;apply();}
  svg.addEventListener('wheel',e=>{e.preventDefault();const b=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-b.left,e.clientY-b.top);},{passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};});
  window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;$('stage').classList.add('dragging');}
    if(drag.moved){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();}});
  window.addEventListener('pointerup',()=>{drag=null;$('stage').classList.remove('dragging');});
  svg.addEventListener('click',e=>{},true);
  $('zin').onclick=()=>{const b=svg.getBoundingClientRect();zoomAt(1.25,b.width/2,b.height/2);};
  $('zout').onclick=()=>{const b=svg.getBoundingClientRect();zoomAt(.8,b.width/2,b.height/2);};
  $('zfit').onclick=fit;
  window.addEventListener('resize',fit);
  svg.addEventListener('contextmenu',e=>e.preventDefault());

  decode(decodeURIComponent(location.hash.slice(1)));
  fit(); render();
})();
</script>
</body>
</html>
